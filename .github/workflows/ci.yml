name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least privilege by default. The default GITHUB_TOKEN is write-capable, which
# is what the Shai-Hulud / keyv worm family uses to self-propagate: steal the
# token from a build, then push workflows or republish packages with it. None of
# the jobs below write to the repo, so read-only costs nothing here. Elevate
# per-job only where a job genuinely needs more.
permissions:
  contents: read

jobs:
  # ■■ Job 1: Lint and type check (runs immediately on every push) ■■
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.10, which is what honors `min-release-age`
          # in .npmrc and what package.json's engines require. Node 20/22 ship
          # npm 10.x and would fail the engine-strict check.
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ■■ Job 2: Tests (runs in parallel with lint) ■■■■■■■■■■■■■■■■■■■■
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  # ■■ Job 3: Security scan (only after tests pass) ■■■■■■■■■■■■■■■■■
  security:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      # Lockfile/tree consistency. A package present in node_modules without a
      # matching lockfile entry is itself a signal, independent of any CVE feed.
      - run: npm ls --all > /dev/null
      # Every exported Convex mutation/query/action is a public internet endpoint
      # — middleware.ts does NOT run for Convex RPC. This fails the build if one
      # omits an identity check without explicitly declaring itself public.
      - name: Convex auth gate
        run: node scripts/check-convex-auth.mjs

  # ■■ Job 4: Build verify (only after tests pass) ■■■■■■■■■■■■■■■■■■
  build:
    needs: [test]
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # If a Doppler service token is configured (set during /install), inject
      # secrets at build time so NEXT_PUBLIC_* values get inlined into the
      # client bundle. Otherwise (forks, legacy mode) the build runs without
      # Doppler — the build will type-check and may fail to bundle if it
      # references missing env vars; that's expected for legacy mode.
      - name: Install Doppler CLI
        if: env.DOPPLER_TOKEN != ''
        # Pinned to a full commit SHA, not a tag. A tag is mutable: whoever
        # controls the action repo can repoint v3 at new code, which is the same
        # class of compromise as a poisoned npm package. Bump deliberately.
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Build (Doppler)
        if: env.DOPPLER_TOKEN != ''
        run: doppler run -- npm run build
      - name: Build (legacy)
        if: env.DOPPLER_TOKEN == ''
        run: npm run build
